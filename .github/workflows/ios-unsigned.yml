name: Build KeySkin unsigned iOS IPA (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode with the iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 26

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri iOS project
        env:
          CI: 'true'
        run: npm run tauri -- ios init --ci

      - name: Build frontend
        run: npm run build

      - name: Build unsigned iPhone app
        env:
          CI: 'true'
        run: npm run tauri -- ios build --ci --no-sign
      - name: Validate and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APPS="src-tauri/gen/apple/build"
          APP="$(find "$APPS" -type d -name '*.app' -print -quit)"
          test -n "$APP" || { echo 'No iPhone .app found'; exit 1; }
          test -f "$APP/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          test -f "$APP/$EXECUTABLE"
          file "$APP/$EXECUTABLE"
          file "$APP/$EXECUTABLE" | grep -q 'Mach-O' || { echo 'Executable is not Mach-O'; exit 1; }
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          (cd package && zip -qry ../KeySkin-v2.0.41-unsigned.ipa Payload)
          unzip -t KeySkin-v2.0.41-unsigned.ipa | tail -n 2

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KeySkin-v2.0.41-unsigned-ipa
          path: KeySkin-v2.0.41-unsigned.ipa
          if-no-files-found: error
